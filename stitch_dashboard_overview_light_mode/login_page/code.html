<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Residencia360 Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#141414",
                        "background-light": "#f7f7f7",
                        "background-dark": "#191919",
                        "brand-accent": "#0B5FFF",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark font-display text-primary overflow-x-hidden antialiased selection:bg-brand-accent/20 selection:text-brand-accent">
<!-- Subtle Background Pattern for Context -->
<div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-white to-transparent opacity-60 pointer-events-none"></div>
<!-- Main Content Wrapper -->
<div class="relative flex flex-col items-center justify-center min-h-screen p-6 w-full max-w-[420px] mx-auto z-10">
<!-- Branding Section -->
<div class="w-full flex flex-col items-center mb-10">
<!-- Logo Mark -->
<div class="w-20 h-20 bg-white rounded-[20px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white flex items-center justify-center mb-6 relative overflow-hidden group">
<!-- Decorative inner pattern -->
<div class="absolute inset-0 opacity-[0.03] bg-[radial-gradient(#0B5FFF_1.5px,transparent_1.5px)] [background-size:12px_12px]"></div>
<!-- Icon -->
<span class="material-symbols-outlined text-brand-accent !text-[40px] drop-shadow-sm transition-transform duration-500 group-hover:scale-110" style="font-variation-settings: 'FILL' 1, 'wght' 600;">health_metrics</span>
</div>
<h1 class="text-primary dark:text-white tracking-tight text-[28px] font-bold leading-tight text-center">Residencia360</h1>
<p class="text-neutral-500 text-base font-medium leading-normal pt-2 text-center">Geriatric Care Management</p>
</div>
<!-- Login Form -->
<div class="w-full flex flex-col gap-6">
<!-- Email Field -->
<div class="group/field">
<label class="block text-primary dark:text-white text-sm font-semibold mb-2 ml-1">Email address</label>
<div class="relative">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none flex items-center">
<span class="material-symbols-outlined !text-[20px]">mail</span>
</div>
<input class="block w-full rounded-xl text-primary border-transparent bg-white shadow-[0_2px_8px_rgba(0,0,0,0.04)] ring-1 ring-neutral-200 focus:ring-2 focus:ring-brand-accent focus:border-transparent h-14 pl-11 pr-4 text-base placeholder:text-neutral-400 transition-all duration-200 ease-in-out" placeholder="care@residencia360.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group/field">
<div class="flex justify-between items-center mb-2 ml-1">
<label class="block text-primary dark:text-white text-sm font-semibold">Password</label>
</div>
<div class="relative">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none flex items-center">
<span class="material-symbols-outlined !text-[20px]">lock</span>
</div>
<input class="block w-full rounded-xl text-primary border-transparent bg-white shadow-[0_2px_8px_rgba(0,0,0,0.04)] ring-1 ring-neutral-200 focus:ring-2 focus:ring-brand-accent focus:border-transparent h-14 pl-11 pr-12 text-base placeholder:text-neutral-400 transition-all duration-200 ease-in-out" placeholder="Enter your password" type="password"/>
<button class="absolute right-0 top-0 h-full px-4 text-neutral-400 hover:text-neutral-600 flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined !text-[22px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="text-sm font-semibold text-brand-accent hover:text-blue-700 transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-brand-accent hover:bg-blue-600 active:scale-[0.98] text-white text-[17px] font-bold rounded-xl shadow-[0_4px_14px_0_rgba(11,95,255,0.39)] hover:shadow-[0_6px_20px_rgba(11,95,255,0.23)] transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                    Log In
                </button>
<!-- Divider -->
<div class="relative py-2 flex items-center justify-center">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-neutral-200/80"></div></div>
<span class="relative bg-background-light dark:bg-background-dark px-4 text-xs font-semibold text-neutral-400 uppercase tracking-widest">Or</span>
</div>
<!-- Google Action -->
<button class="w-full h-14 bg-white border border-neutral-200/60 hover:bg-neutral-50 hover:border-neutral-300 active:scale-[0.98] text-primary text-base font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-3 shadow-sm">
<img alt="Google G Logo" class="w-5 h-5" data-alt="Google G Logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMMB-zfL81zzYeT0vdEP0pgwQLpfaHOwhHkBvFjTPQaDl9KQo3POGBBimjCQ6nWd0KgH9VFmYX1XwF4Ol_DAkfRLc7KO1OHitFrg6moyg3TzyRhoDMTdMr54juXndFZ_l8l_2Fzy80QT9u0BCylt-IusrT2ls3k7uPG_gcNq7uH2pdPdtfkGSSogag8qkZQdJDePFKVr_FnFPEIamO0ApevVZXGjEznMwl70lFi4ufqZOa4e1wTjEZC3k39iHLuaYbkC-9PI7lMo0"/>
<span>Sign in with Google</span>
</button>
</div>
<!-- Footer -->
<div class="mt-auto pt-10 pb-4 text-center w-full">
<p class="text-neutral-500 text-sm">
                    Don't have an account? 
                    <a class="font-bold text-brand-accent hover:underline decoration-2 underline-offset-2 ml-1" href="#">Request Access</a>
</p>
<div class="mt-8 flex items-center justify-center gap-2 opacity-40">
<div class="h-1 w-1 rounded-full bg-neutral-400"></div>
<div class="h-1 w-1 rounded-full bg-neutral-400"></div>
<div class="h-1 w-1 rounded-full bg-neutral-400"></div>
</div>
</div>
</div>
</div>
</body></html>
