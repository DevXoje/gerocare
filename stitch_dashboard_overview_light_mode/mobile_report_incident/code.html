<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Incident - Residencia360</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#141414",
              "background-light": "#f7f7f7",
              "background-dark": "#191919",
              "accent-blue": "#0B5FFF",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-primary dark:text-white antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto bg-white dark:bg-[#1e1e1e] shadow-xl">
<!-- Header -->
<header class="sticky top-0 z-50 flex items-center justify-between bg-white/80 dark:bg-[#1e1e1e]/80 p-4 backdrop-blur-md border-b border-gray-100 dark:border-gray-800">
<button aria-label="Cancel" class="text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-white transition-colors">
<span class="text-base font-medium">Cancel</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em]">Report Incident</h1>
<div class="w-[50px]"></div> <!-- Spacer to center title -->
</header>
<main class="flex-1 overflow-y-auto pb-24 px-5 pt-4">
<!-- Section 1: Type -->
<div class="mb-8">
<label class="block text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Incident Type</label>
<div class="grid grid-cols-3 gap-3">
<button class="group flex flex-col items-center justify-center p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:border-accent-blue hover:bg-accent-blue/5 dark:hover:bg-accent-blue/10 transition-all focus:outline-none focus:ring-2 focus:ring-accent-blue focus:ring-offset-1 dark:focus:ring-offset-[#1e1e1e]">
<span class="material-symbols-outlined text-3xl mb-1 text-gray-400 group-hover:text-accent-blue transition-colors">personal_injury</span>
<span class="text-sm font-semibold group-hover:text-accent-blue transition-colors">Fall</span>
</button>
<button class="group flex flex-col items-center justify-center p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:border-accent-blue hover:bg-accent-blue/5 dark:hover:bg-accent-blue/10 transition-all focus:outline-none focus:ring-2 focus:ring-accent-blue focus:ring-offset-1 dark:focus:ring-offset-[#1e1e1e]">
<span class="material-symbols-outlined text-3xl mb-1 text-gray-400 group-hover:text-accent-blue transition-colors">medical_services</span>
<span class="text-sm font-semibold group-hover:text-accent-blue transition-colors">Health</span>
</button>
<button class="group flex flex-col items-center justify-center p-3 rounded-xl border-2 border-accent-blue bg-accent-blue/10 dark:bg-accent-blue/20 transition-all focus:outline-none focus:ring-2 focus:ring-accent-blue focus:ring-offset-1 dark:focus:ring-offset-[#1e1e1e]">
<span class="material-symbols-outlined text-3xl mb-1 text-accent-blue">psychology</span>
<span class="text-sm font-bold text-accent-blue">Behavior</span>
</button>
</div>
</div>
<!-- Section 2: Details -->
<div class="mb-8 space-y-5">
<label class="block text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Details</label>
<div class="flex flex-col gap-4">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400">schedule</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-primary dark:text-white text-base font-medium focus:border-accent-blue focus:ring-accent-blue transition-shadow appearance-none cursor-pointer" type="time" value="10:45"/>
<label class="absolute -top-2 left-3 bg-white dark:bg-[#1e1e1e] px-1 text-xs font-medium text-gray-500 dark:text-gray-400">Time of Incident</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400">location_on</span>
</div>
<select class="block w-full pl-12 pr-10 py-4 rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-primary dark:text-white text-base font-medium focus:border-accent-blue focus:ring-accent-blue transition-shadow appearance-none cursor-pointer">
<option>Dining Hall</option>
<option>Room 101 - J. Doe</option>
<option>Room 102 - M. Smith</option>
<option>Common Area B</option>
<option>Garden</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400">expand_more</span>
</div>
<label class="absolute -top-2 left-3 bg-white dark:bg-[#1e1e1e] px-1 text-xs font-medium text-gray-500 dark:text-gray-400">Location</label>
</div>
</div>
</div>
<!-- Section 3: Severity -->
<div class="mb-8">
<label class="block text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Severity</label>
<div class="flex bg-gray-100 dark:bg-gray-800 p-1.5 rounded-xl">
<button class="flex-1 py-3 px-4 rounded-lg text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-white focus:outline-none transition-colors">
                        Low
                    </button>
<button class="flex-1 py-3 px-4 rounded-lg bg-white dark:bg-[#2a2a2a] text-sm font-bold text-accent-blue shadow-sm border border-gray-200/50 dark:border-gray-600 focus:outline-none transition-all transform scale-[1.02]">
                        Medium
                    </button>
<button class="flex-1 py-3 px-4 rounded-lg text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-red-600 dark:hover:text-red-400 focus:outline-none transition-colors">
                        High
                    </button>
</div>
</div>
<!-- Section 4: Description -->
<div class="mb-4">
<label class="block text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Notes</label>
<textarea class="block w-full p-4 rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-primary dark:text-white text-base placeholder-gray-400 focus:border-accent-blue focus:ring-accent-blue transition-shadow resize-none" placeholder="Describe what happened clearly..." rows="4"></textarea>
</div>
</main>
<!-- Submit Button Footer -->
<div class="fixed bottom-[88px] left-0 right-0 z-40 px-5 max-w-md mx-auto pointer-events-none">
<button class="pointer-events-auto w-full bg-[#0B5FFF] hover:bg-[#094dcf] text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-blue-500/30 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Submit Report</span>
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
<!-- Bottom Navigation -->
<nav class="sticky bottom-0 z-50 w-full bg-white dark:bg-[#1e1e1e] border-t border-gray-100 dark:border-gray-800 pb-safe pt-2 px-2 pb-2">
<div class="grid grid-cols-4 gap-1">
<button class="flex flex-col items-center justify-center py-2 text-gray-400 hover:text-primary dark:hover:text-white transition-colors">
<span class="material-symbols-outlined mb-1">home</span>
<span class="text-[10px] font-medium">Home</span>
</button>
<button class="flex flex-col items-center justify-center py-2 text-gray-400 hover:text-primary dark:hover:text-white transition-colors">
<span class="material-symbols-outlined mb-1">diversity_1</span>
<span class="text-[10px] font-medium">Residents</span>
</button>
<button class="flex flex-col items-center justify-center py-2 text-accent-blue dark:text-accent-blue transition-colors">
<span class="material-symbols-outlined mb-1 fill-current font-variation-settings-fill">report_problem</span>
<span class="text-[10px] font-bold">Incidents</span>
</button>
<button class="flex flex-col items-center justify-center py-2 text-gray-400 hover:text-primary dark:hover:text-white transition-colors">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="text-[10px] font-medium">Settings</span>
</button>
</div>
</nav>
<!-- CSS for Fill Variation in Material Symbols -->
<style>
            .font-variation-settings-fill {
                font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
        </style>
</div>
</body></html>
