version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerocare-dev
    volumes:
      # Montar el código para hot-reload
      - .:/app
      # Montar node_modules como volumen para mejor rendimiento
      - /app/node_modules
      # Persistir datos de Firebase emulators
      - firestore-data:/app/firestore_export
    ports:
      - "5173:5173" # Vite dev server
      - "8080:8080" # Firestore emulator
      - "9099:9099" # Auth emulator
      - "4000:4000" # Firebase UI
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    command: npm run dev:emulators

volumes:
  firestore-data:
